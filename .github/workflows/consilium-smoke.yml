name: agents-consilium

on:
  pull_request:
    paths:
      - 'skills/agents-consilium/**'
      - '.github/workflows/consilium-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'skills/agents-consilium/**'
      - '.github/workflows/consilium-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: skills/agents-consilium
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Platform regressions with native Python
        run: python scripts/tests/platform_test.py -v

      - name: Config helpers emit LF-only agent ids
        run: |
          export CONSILIUM_CONFIG="$PWD/scripts/tests/fixtures/test-config.json"
          source scripts/lib/common.sh
          source scripts/lib/config.sh
          config_validate
          ids="$(mktemp)"
          trap 'rm -f "$ids"' EXIT
          config_enabled_agents > "$ids"
          test -s "$ids"
          if grep -q $'\r' "$ids"; then
            echo 'CR found in config_enabled_agents output'
            exit 1
          fi
          while IFS= read -r agent; do
            backend="$(config_get_field "$agent" backend)"
            test -n "$backend"
            echo "$agent -> $backend"
          done < "$ids"

      - name: consilium --help
        run: bash scripts/consilium --help

      # The existing shell harness uses POSIX executable and /tmp semantics.
      # Windows is gated by native-Python integration tests above.
      - name: Full offline regression suite
        if: runner.os != 'Windows'
        run: bash scripts/tests/run.sh
